<section class="home-container">
  <!-- Header section defining the purpose of the tool -->
  <header class="hero">
    <h1>Affective-Sync Dashboard</h1>
    <p class="description">
      Professional tool for automated facial expression annotation.
    </p>
  </header>

  <!-- Drop zone for experiment video files -->
  <main
    class="upload-zone"
    [class.dragging]="isDragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <!-- Display upload prompt if no file is selected -->
    @if (!selectedFile()) {
      <div class="drop-prompt">
        <div class="icon">📁</div>
        <h3>Drop video file here</h3>
        <p>Or click to browse from your device</p>
        <input
          type="file"
          (change)="onFileSelected($event)"
          accept="video/mp4,video/x-matroska,video/webm"
          hidden
          #fileInput
        />
        <button class="btn-browse" (click)="fileInput.click()">Browse</button>
      </div>
    }
    <!-- Display summary if a file is ready for analysis -->
    @else {
      <div class="file-summary">
        <div class="icon">✅</div>
        <h3>{{ selectedFile()?.name }}</h3>
        <p>Ready for synchronization with physiological data</p>
        <button class="btn-primary">Initialize Analysis</button>
      </div>
    }
  </main>
</section>
